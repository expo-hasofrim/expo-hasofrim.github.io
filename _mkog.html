<!doctype html><meta charset="utf-8">
<canvas id="c" width="1200" height="630"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const G=x.createLinearGradient(0,0,0,630);
G.addColorStop(0,'#1b260f');G.addColorStop(1,'#324222');
x.fillStyle=G;x.fillRect(0,0,1200,630);
// bronze frame
x.strokeStyle='#B88E67';x.lineWidth=2;x.strokeRect(40,40,1120,550);
x.strokeStyle='rgba(232,201,162,.35)';x.lineWidth=1;x.strokeRect(52,52,1096,526);
// skyline silhouette
x.fillStyle='rgba(232,201,162,.10)';
let bx=60;
const hs=[70,120,95,150,110,175,90,130,160,100,140,85,120,155,105,135,95,165,115,80];
hs.forEach((h,i)=>{const w=48+(i%3)*14;x.fillRect(bx,590-h,w,h);bx+=w+10;});
// text
x.textAlign='center';x.direction='rtl';
x.fillStyle='#e8c9a2';x.font='600 30px Heebo, Arial';
x.fillText('מדריך מידע ועסקים שנתי', 600, 210);
x.fillStyle='#fff';x.font='700 92px Heebo, Arial';
x.fillText('אקספו הסופרים', 600, 320);
x.fillStyle='#B88E67';x.font='700 54px Heebo, Arial';
x.fillText('תשפ״ז', 600, 396);
// rule
x.strokeStyle='#B88E67';x.lineWidth=2;x.beginPath();x.moveTo(430,432);x.lineTo(770,432);x.stroke();
x.fillStyle='rgba(255,255,255,.88)';x.font='400 30px Heebo, Arial';
x.fillText('מתחם הסופרים · צפון בני ברק', 600, 486);
document.title='ready';
window.__png = c.toDataURL('image/png');
</script>
